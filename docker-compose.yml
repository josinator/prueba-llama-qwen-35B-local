services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: 1000
        HOST_GID: 1000
    container_name: books_api_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - ./vendor:/app/vendor
      - ./node_modules:/app/node_modules
    environment:
      DATABASE_URL: "mysql://symfony:symfony@database:3306/books?serverVersion=mariadb-10.11.16&charset=utf8mb4"
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-thisissecretfordeveloponlocal}
      DEFAULT_URI: http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "9000:9000"

  database:
    image: mariadb:10.11
    container_name: books_api_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: books
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    volumes:
      - db_data:/var/lib/mysql
      - ./dumps:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: books_api_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - .:/app
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  db_data:

